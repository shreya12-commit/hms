<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Front Desk{% endblock %} · Harbour House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <aside class="side">
    <div class="brand"><span class="brand-key">H</span><span>Harbour House<small>Front desk</small></span></div>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Today</a>
      <a href="{{ url_for('bookings') }}" class="{{ 'on' if request.endpoint == 'bookings' }}">Bookings</a>
      <a href="{{ url_for('new_booking') }}" class="{{ 'on' if request.endpoint == 'new_booking' }}">New booking</a>
      <a href="{{ url_for('rooms') }}" class="{{ 'on' if request.endpoint == 'rooms' }}">Rooms</a>
      <a href="{{ url_for('guests') }}" class="{{ 'on' if request.endpoint == 'guests' }}">Guests</a>
    </nav>
  </aside>
  <main>
    <header class="top">
      <h1>{% block heading %}{% endblock %}</h1>
      <span class="date">{{ today.strftime('%A, %d %B %Y') }}</span>
    </header>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}" role="status">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
